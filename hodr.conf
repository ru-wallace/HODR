# HODR Configuration File
# This file contains initial settings for the HODR application. Modify these values as needed.
# These are the default values - changes made while the program is running will not be saved to this file. To change the default values, edit this file and restart the program.

#Mode: Whether HODR uses set integration time (0) or set target intensity (1)
mode=0
#Target intensity: The target max raw count used to auto adjust integration time (used when mode=1)
target_intensity=60000
#target integration time: The integration time used when mode=0
integration_time=0.01
minimum_integration_time=0.00
maximum_integration_time=900.00
#Preamp gain: The preamp gain used for the camera (0=1x, 1=1.7x)
pre_amp_gain=0
target_temperature=-70
cooler_mode=1
wallclock_active=1
wallclock_interval_minutes=1


